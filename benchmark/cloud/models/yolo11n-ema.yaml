# Ultralytics YOLO11n + EMA (Efficient Multi-Scale Attention, Ouyang et al. 2023, at P3/P4/P5 neck outputs)
# For scale 'n' (width=0.25), P3/8=64ch, P4/16=128ch, P5/32=256ch.
# Layers 0..22 match official YOLO11n 100%, preserving 100% backbone+neck pretrained weight transfer.
# COCO template nc: 80 preserves full 493/499 pretrained tensor transfer before dataset nc override at train time.
nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small, 64ch at scale n)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium, 128ch at scale n)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large, 256ch at scale n)

  - [16, 1, EMA, [64]] # 23 P3-EMA
  - [19, 1, EMA, [128]] # 24 P4-EMA
  - [22, 1, EMA, [256]] # 25 P5-EMA

  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect
